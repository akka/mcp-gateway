    <title>MCP Tools — MCP Connections</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 900px; margin: 0 auto; padding: 0 24px; color: #1a1a1a; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #e8e8e8; margin-bottom: 36px; }
        .top-bar-title { font-size: 1rem; font-weight: 600; color: #1a1a1a; }
        .top-bar-logo { height: 36px; width: auto; display: block; }
        .top-bar-links { display: flex; align-items: center; gap: 14px; font-size: 0.88rem; }
        .btn-link { padding: 6px 14px; border-radius: 6px; border: 1px solid #d0d0d0; background: #fff; color: #555; text-decoration: none; font-size: 0.85rem; }
        .btn-link:hover { background: #f5f5f5; }
        h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 4px; margin-top: 0; }
        p.subtitle { color: #666; margin-top: 0; margin-bottom: 24px; }
        .stats { display: flex; gap: 16px; margin-bottom: 24px; }
        .stat { background: #f7f8fa; border: 1px solid #e8e8e8; border-radius: 8px; padding: 12px 18px; min-width: 90px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: #1a1a1a; line-height: 1; }
        .stat-label { font-size: 0.75rem; color: #888; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        .filter-bar input { flex: 1; padding: 8px 12px; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 0.9rem; outline: none; }
        .filter-bar input:focus { border-color: #0070d2; box-shadow: 0 0 0 2px rgba(0,112,210,0.15); }
        .filter-bar select { padding: 8px 12px; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 0.9rem; background: #fff; }
        .mcp-section { margin-bottom: 36px; }
        .mcp-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid #e8e8e8; }
        .mcp-name { font-size: 1rem; font-weight: 600; }
        .mcp-id { font-size: 0.78rem; color: #888; font-family: monospace; background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
        .mcp-count { font-size: 0.78rem; color: #888; margin-left: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        th { text-align: left; padding: 8px 12px; font-size: 0.75rem; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 2px solid #e8e8e8; }
        td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafafa; }
        .tool-name { font-family: monospace; font-size: 0.85rem; color: #1a1a1a; }
        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
        .badge-read { background: #e6f4ea; color: #1e7e34; border: 1px solid #b7dfbf; }
        .badge-write { background: #fff3e0; color: #b45309; border: 1px solid #fcd9a0; }
        .badge-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .badge-read .badge-dot { background: #1e7e34; }
        .badge-write .badge-dot { background: #b45309; }
        .source { font-size: 0.75rem; color: #888; }
        .source-annotation { color: #0070d2; }
        .source-schema { color: #7c3aed; }
        .hint-yes { color: #1e7e34; font-size: 0.75rem; }
        .hint-no { color: #b45309; font-size: 0.75rem; }
        .hint-null { color: #bbb; font-size: 0.75rem; }
        .empty { color: #999; font-size: 0.9rem; padding: 24px 0; text-align: center; }
        .empty-registry { background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 16px 20px; color: #795548; font-size: 0.88rem; margin-bottom: 24px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <svg width="210" height="60" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" style="display:block"><rect width="120" height="120" fill="#04061a"/><g transform="translate(60,65) scale(0.28)"><path d="M-100 80 L0 0 L100 80" fill="none" stroke="#3b82f6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="0" x2="0" y2="-40" stroke="#3b82f6" stroke-width="24" stroke-linecap="round"/><path d="M0 -140 V40" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/><path d="M-45 -95 L0 -145 L45 -95" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-100" cy="80" r="32" fill="#fbbf24"/><circle cx="100" cy="80" r="32" fill="#fbbf24"/><circle cx="0" cy="0" r="36" fill="#fbbf24"/></g><g transform="translate(136,62)"><text font-family="Inter,system-ui,-apple-system,sans-serif" font-weight="900" font-size="52" fill="#04061a" letter-spacing="-2" dominant-baseline="auto">AKKA</text><text y="30" font-family="Inter,system-ui,-apple-system,sans-serif" font-weight="500" font-size="26" fill="#04061a" dominant-baseline="auto">MCP Gateway</text></g></svg>
        <div class="top-bar-links">
            <a class="btn-link" href="/">Back</a>
            <a class="btn-link" href="/auth/logout">Sign out</a>
        </div>
    </div>

    <h1>MCP Tools</h1>
    <p class="subtitle">Tools registered from connected MCP servers, with inferred read/write classification.</p>

    <div class="stats">
        <div class="stat"><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total tools</div></div>
        <div class="stat"><div class="stat-value" id="stat-read" style="color:#1e7e34">—</div><div class="stat-label">Read</div></div>
        <div class="stat"><div class="stat-value" id="stat-write" style="color:#b45309">—</div><div class="stat-label">Write</div></div>
        <div class="stat"><div class="stat-value" id="stat-mcps">—</div><div class="stat-label">MCP servers</div></div>
    </div>

    <div class="filter-bar">
        <input type="text" id="filter-input" placeholder="Filter by tool name…" oninput="render()">
        <select id="filter-op" onchange="render()">
            <option value="">All operations</option>
            <option value="read">Read only</option>
            <option value="write">Write only</option>
        </select>
        <select id="filter-source" onchange="render()">
            <option value="">All sources</option>
            <option value="annotation">Annotation</option>
            <option value="schema">Schema</option>
        </select>
    </div>

    <div id="content"></div>

    <script>
        let allConfigs = [];

        function opType(tool) {
            if (tool.readOnlyHint !== null && tool.readOnlyHint !== undefined) return tool.readOnlyHint ? 'read' : 'write';
            return tool.hasBodyParam ? 'write' : 'read';
        }

        function sourceLabel(tool) {
            if (tool.readOnlyHint !== null && tool.readOnlyHint !== undefined) return 'annotation';
            return 'schema';
        }

        function render() {
            const nameFilter = document.getElementById('filter-input').value.toLowerCase();
            const opFilter = document.getElementById('filter-op').value;
            const srcFilter = document.getElementById('filter-source').value;
            const content = document.getElementById('content');

            if (allConfigs.length === 0) {
                content.innerHTML = '<div class="empty-registry">No tools registered yet. The registry is populated when an MCP client calls <code>tools/list</code> through the proxy. Reconnect your MCP client to seed it.</div>';
                return;
            }

            let html = '';
            let shown = 0;

            for (const mcp of allConfigs) {
                const tools = (mcp.tools || []).filter(t => {
                    if (nameFilter && !t.name.toLowerCase().includes(nameFilter)) return false;
                    if (opFilter && opType(t) !== opFilter) return false;
                    if (srcFilter && sourceLabel(t) !== srcFilter) return false;
                    return true;
                });

                if (tools.length === 0) continue;
                shown += tools.length;

                html += `<div class="mcp-section">
                    <div class="mcp-header">
                        <span class="mcp-name">${esc(mcp.name)}</span>
                        <span class="mcp-id">${esc(mcp.mcpId)}</span>
                        <span class="mcp-count">${tools.length} tool${tools.length !== 1 ? 's' : ''}</span>
                    </div>
                    <table>
                        <thead><tr>
                            <th>Tool</th>
                            <th>Operation</th>
                            <th>Source</th>
                            <th>readOnlyHint</th>
                            <th>hasBodyParam</th>
                        </tr></thead>
                        <tbody>`;

                for (const t of tools) {
                    const op = opType(t);
                    const src = sourceLabel(t);
                    const hintVal = t.readOnlyHint !== null && t.readOnlyHint !== undefined
                        ? (t.readOnlyHint ? '<span class="hint-yes">true</span>' : '<span class="hint-no">false</span>')
                        : '<span class="hint-null">—</span>';
                    const bodyVal = t.hasBodyParam
                        ? '<span class="hint-no">true</span>'
                        : '<span class="hint-yes">false</span>';
                    html += `<tr>
                        <td><span class="tool-name">${esc(t.name)}</span></td>
                        <td>${op === 'read'
                            ? '<span class="badge badge-read"><span class="badge-dot"></span>READ</span>'
                            : '<span class="badge badge-write"><span class="badge-dot"></span>WRITE</span>'}</td>
                        <td><span class="source source-${src}">${src}</span></td>
                        <td>${hintVal}</td>
                        <td>${bodyVal}</td>
                    </tr>`;
                }

                html += `</tbody></table></div>`;
            }

            if (shown === 0) {
                html = '<p class="empty">No tools match the current filters.</p>';
            }

            content.innerHTML = html;
        }

        function updateStats() {
            const all = allConfigs.flatMap(c => c.tools || []);
            document.getElementById('stat-total').textContent = all.length;
            document.getElementById('stat-read').textContent = all.filter(t => opType(t) === 'read').length;
            document.getElementById('stat-write').textContent = all.filter(t => opType(t) === 'write').length;
            document.getElementById('stat-mcps').textContent = allConfigs.length;
        }

        function esc(s) {
            return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        fetch('/mcp/tools/data')
            .then(r => r.json())
            .then(data => {
                allConfigs = data.configs || [];
                updateStats();
                render();
            })
            .catch(err => {
                document.getElementById('content').innerHTML =
                    '<p class="empty">Failed to load tool registry: ' + esc(String(err)) + '</p>';
            });
    </script>
</body>
</html>
