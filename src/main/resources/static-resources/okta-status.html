    <title>Okta User Status — MCP Connections</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 600px; margin: 0 auto; padding: 0 24px; color: #1a1a1a; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #e8e8e8; margin-bottom: 36px; }
        .top-bar-title { font-size: 1rem; font-weight: 600; color: #1a1a1a; }
        .top-bar-logo { height: 36px; width: auto; display: block; }
        .top-bar-links { display: flex; align-items: center; gap: 14px; font-size: 0.88rem; }
        .btn-link { padding: 6px 14px; border-radius: 6px; border: 1px solid #d0d0d0; background: #fff; color: #555; text-decoration: none; font-size: 0.85rem; }
        .btn-link:hover { background: #f5f5f5; }
        h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 4px; margin-top: 0; }
        p.subtitle { color: #666; margin-top: 0; margin-bottom: 28px; }
        .card { border: 1px solid #e8e8e8; border-radius: 10px; overflow: hidden; }
        .card-header { padding: 16px 20px; background: #fafafa; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; gap: 12px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .status-ACTIVE { background: #22c55e; }
        .status-SUSPENDED { background: #f59e0b; }
        .status-DEPROVISIONED { background: #ef4444; }
        .status-LOCKED_OUT { background: #ef4444; }
        .status-PASSWORD_EXPIRED { background: #f59e0b; }
        .status-RECOVERY { background: #f59e0b; }
        .status-STAGED { background: #94a3b8; }
        .status-PROVISIONED { background: #94a3b8; }
        .status-unknown { background: #d1d5db; }
        .card-header-name { font-weight: 600; font-size: 1rem; }
        .card-header-email { font-size: 0.85rem; color: #666; }
        .status-badge { margin-left: auto; display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
        .badge-ACTIVE { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-SUSPENDED { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .badge-DEPROVISIONED { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .badge-LOCKED_OUT { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .badge-PASSWORD_EXPIRED { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .badge-RECOVERY { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .badge-default { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .field { display: flex; padding: 11px 20px; border-bottom: 1px solid #f0f0f0; font-size: 0.88rem; }
        .field:last-child { border-bottom: none; }
        .field-label { width: 150px; flex-shrink: 0; color: #888; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 1px; }
        .field-value { flex: 1; color: #1a1a1a; }
        .error { color: #991b1b; background: #fee2e2; border: 1px solid #fecaca; border-radius: 8px; padding: 14px 18px; font-size: 0.9rem; }
        .loading { color: #888; font-size: 0.9rem; padding: 12px 0; }
        .btn-refresh { padding: 7px 16px; background: #0070d2; color: white; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: 500; cursor: pointer; margin-bottom: 20px; }
        .btn-refresh:hover { background: #005fb2; }
        .btn-refresh:disabled { background: #93c5fd; cursor: default; }
    </style>
</head>
<body>
    <div class="top-bar">
        <svg width="210" height="60" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" style="display:block"><rect width="120" height="120" fill="#04061a"/><g transform="translate(60,65) scale(0.28)"><path d="M-100 80 L0 0 L100 80" fill="none" stroke="#3b82f6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="0" x2="0" y2="-40" stroke="#3b82f6" stroke-width="24" stroke-linecap="round"/><path d="M0 -140 V40" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/><path d="M-45 -95 L0 -145 L45 -95" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-100" cy="80" r="32" fill="#fbbf24"/><circle cx="100" cy="80" r="32" fill="#fbbf24"/><circle cx="0" cy="0" r="36" fill="#fbbf24"/></g><g transform="translate(136,62)"><text font-family="Inter,system-ui,-apple-system,sans-serif" font-weight="900" font-size="52" fill="#04061a" letter-spacing="-2" dominant-baseline="auto">AKKA</text><text y="30" font-family="Inter,system-ui,-apple-system,sans-serif" font-weight="500" font-size="26" fill="#04061a" dominant-baseline="auto">MCP Gateway</text></g></svg>
        <div class="top-bar-links">
            <a class="btn-link" href="/">Back</a>
            <a class="btn-link" href="/auth/logout">Sign out</a>
        </div>
    </div>

    <h1>Okta User Status</h1>
    <p class="subtitle">Live status of the currently logged-in user from Okta.</p>

    <button class="btn-refresh" id="btn-refresh" onclick="load()">Refresh</button>

    <div id="content"><p class="loading">Loading…</p></div>

    <script>
        function load() {
            var btn = document.getElementById('btn-refresh');
            btn.disabled = true;
            btn.textContent = 'Loading…';

            fetch('/auth/okta-status', { cache: 'no-store' })
                .then(function(r) {
                    if (r.status === 401 || r.redirected) { window.location.href = '/login'; return null; }
                    return r.ok ? r.json().then(function(d) { return { ok: true, data: d }; })
                                : r.text().then(function(t) { return { ok: false, text: t, status: r.status }; });
                })
                .then(function(result) {
                    btn.disabled = false;
                    btn.textContent = 'Refresh';
                    if (!result) return;
                    if (!result.ok) {
                        document.getElementById('content').innerHTML =
                            '<div class="error">Error ' + result.status + ': ' + esc(result.text) + '</div>';
                        return;
                    }
                    render(result.data);
                })
                .catch(function(e) {
                    btn.disabled = false;
                    btn.textContent = 'Refresh';
                    document.getElementById('content').innerHTML =
                        '<div class="error">Request failed: ' + esc(e.message) + '</div>';
                });
        }

        function render(d) {
            var status = d.status || 'unknown';
            var dotClass = 'status-' + (knownStatus(status) ? status : 'unknown');
            var badgeClass = 'badge-' + (knownBadge(status) ? status : 'default');
            var name = [d.firstName, d.lastName].filter(Boolean).join(' ') || d.login || '—';

            var html = '<div class="card">' +
                '<div class="card-header">' +
                    '<div class="status-dot ' + dotClass + '"></div>' +
                    '<div><div class="card-header-name">' + esc(name) + '</div>' +
                    '<div class="card-header-email">' + esc(d.email || d.login || '') + '</div></div>' +
                    '<span class="status-badge ' + badgeClass + '">' + esc(status) + '</span>' +
                '</div>' +
                field('Login', d.login) +
                field('Email', d.email) +
                field('Status', d.status) +
                field('Created', fmt(d.created)) +
                field('Last login', fmt(d.lastLogin)) +
                field('Password changed', fmt(d.passwordChanged)) +
                field('Status changed', fmt(d.statusChanged)) +
                '</div>';

            document.getElementById('content').innerHTML = html;
        }

        function field(label, value) {
            return '<div class="field"><div class="field-label">' + esc(label) + '</div>' +
                   '<div class="field-value">' + esc(value || '—') + '</div></div>';
        }

        function fmt(iso) {
            if (!iso) return '—';
            try { return new Date(iso).toLocaleString(); } catch(e) { return iso; }
        }

        function knownStatus(s) {
            return ['ACTIVE','SUSPENDED','DEPROVISIONED','LOCKED_OUT','PASSWORD_EXPIRED','RECOVERY','STAGED','PROVISIONED'].indexOf(s) >= 0;
        }

        function knownBadge(s) {
            return ['ACTIVE','SUSPENDED','DEPROVISIONED','LOCKED_OUT','PASSWORD_EXPIRED','RECOVERY'].indexOf(s) >= 0;
        }

        function esc(s) {
            return String(s || '')
                .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        load();
    </script>
</body>
</html>
