hubspot {
  mcp-url = "https://mcp.hubspot.com"
  mcp-url = ${?HUBSPOT_MCP_URL}
  okta-app-id = ""
  okta-app-id = ${?HUBSPOT_OKTA_APP_ID}
  oauth {
    client-id = ""
    client-id = ${?HUBSPOT_CLIENT_ID}
    client-secret = ""
