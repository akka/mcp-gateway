gmail {
  mcp-url = "https://gmailmcp.googleapis.com/mcp/v1"
  mcp-url = ${?GMAIL_MCP_URL}
  # Gmail, Calendar and Drive share one Google Okta application by default.
  okta-app-id = ${google-drive.okta-app-id}
  okta-app-id = ${?GMAIL_OKTA_APP_ID}
  oauth {
    client-id = ""
    client-id = ${?GMAIL_CLIENT_ID}
    client-secret = ""
    client-secret = ${?GMAIL_CLIENT_SECRET}
    redirect-uri = ""
    redirect-uri = ${?GMAIL_REDIRECT_URI}
  }
}


