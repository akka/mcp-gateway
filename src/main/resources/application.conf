  mcp-url = "https://calendarmcp.googleapis.com/mcp/v1"
  mcp-url = ${?GOOGLE_CALENDAR_MCP_URL}
  # Shares the Google Okta application (see gmail).
  okta-app-id = ${google-drive.okta-app-id}
  okta-app-id = ${?GOOGLE_CALENDAR_OKTA_APP_ID}
  oauth {
    client-id = ""
    client-id = ${?GOOGLE_CALENDAR_CLIENT_ID}
    client-secret = ""
    client-secret = ${?GOOGLE_CALENDAR_CLIENT_SECRET}
    redirect-uri = ""
    redirect-uri = ${?GOOGLE_CALENDAR_REDIRECT_URI}
