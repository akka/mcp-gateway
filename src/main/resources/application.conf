akka.javasdk.dev-mode {
    persistence.enabled = true
    acl.enabled = false
}

akka.http.server.request-timeout = 5 minutes

akka.javasdk {
  agent {
    model-provider = anthropic

    anthropic {
      model-name = "claude-opus-4-6"
      api-key = ${?ANTHROPIC_API_KEY}
      max-tokens = 5000
    }

    for-component.zoho-desk-agent {
      model-provider = anthropic
      anthropic {
        model-name = "claude-sonnet-4-6"
        api-key = ${?ANTHROPIC_API_KEY}
        max-tokens = 8000
      }
    }

    for-component.zoho-desk-query-agent {
      model-provider = anthropic
      anthropic {
        model-name = "claude-haiku-4-5-20251001"
        api-key = ${?ANTHROPIC_API_KEY}
        max-tokens = 8000
      }
    }
  }
}

mcp {
  # Externally-visible base URL of this service — used in OAuth metadata and logout redirects.
  base-url = "http://localhost:9000"
  base-url = ${?MCP_BASE_URL}
}

support {
  # Where users are directed to request new integrations or get help. Blank falls back to a
  # generic "your gateway administrator" message. No checked-in defaults (internal contacts).
  email = ""
  email = ${?SUPPORT_EMAIL}
  slack-channel = ""
  slack-channel = ${?SUPPORT_SLACK_CHANNEL}
}

okta {
  client-id = ""
  client-id = ${?OKTA_CLIENT_ID}
  client-secret = ""
  client-secret = ${?OKTA_CLIENT_SECRET}
  issuer-url = ""
  issuer-url = ${?OKTA_ISSUER_URL}
  redirect-uri = ""
  redirect-uri = ${?OKTA_REDIRECT_URI}
  # No checked-in default: the JWKS host reveals the Okta tenant. Set OKTA_JWKS_URI per deployment.
  jwks-uri = ""
  jwks-uri = ${?OKTA_JWKS_URI}
  api-token = ""
  api-token = ${?MCP_PROXY_OKTA_API_TOKEN}

  # Email domain end users must sign in with, e.g. "example.com". Blank = no domain restriction.
  allowed-email-domain = ""
  allowed-email-domain = ${?OKTA_ALLOWED_EMAIL_DOMAIN}

  # Okta group names that grant gateway roles. No checked-in defaults — set per deployment.
  # Blank = the role is granted to nobody (fails closed).
  groups {
    reader = ""
    reader = ${?OKTA_GROUP_READER}
    writer = ""
    writer = ${?OKTA_GROUP_WRITER}
    admin = ""
    admin = ${?OKTA_GROUP_ADMIN}
    escalater = ""
    escalater = ${?OKTA_GROUP_ESCALATER}
  }
}

salesforce {
  mcp-url = ""
  mcp-url = ${?SALESFORCE_MCP_URL}
  # Okta app instance id gating access to this system. No checked-in default (reveals the tenant).
  okta-app-id = ""
  okta-app-id = ${?SALESFORCE_OKTA_APP_ID}
  oauth {
    client-id = ""
    client-id = ${?SALESFORCE_CLIENT_ID}
    client-secret = ""
    client-secret = ${?SALESFORCE_CLIENT_SECRET}
    redirect-uri = ""
    redirect-uri = ${?SALESFORCE_REDIRECT_URI}
    # Salesforce org login host, e.g. "https://your-org.my.salesforce.com". No checked-in default.
    login-url = ""
    login-url = ${?SALESFORCE_OAUTH_LOGIN_URL}
  }
}

akka-salesforce {
  # Our own akka-salesforce-mcp-server, complementing the hosted Salesforce MCP server with
  # additional tools. Reuses the Salesforce OAuth connection above — no separate credentials.
  mcp-url = ""
  mcp-url = ${?AKKA_SALESFORCE_MCP_URL}
  # Shares the Salesforce Okta application by default; override only if it gets its own.
  okta-app-id = ${salesforce.okta-app-id}
  okta-app-id = ${?AKKA_SALESFORCE_OKTA_APP_ID}
}

zoho {
  mcp-url = ""
  mcp-url = ${?ZOHO_MCP_URL}
  redirect-uri = ""
  redirect-uri = ${?ZOHO_REDIRECT_URI}
  okta-app-id = ""
  okta-app-id = ${?ZOHO_OKTA_APP_ID}
}

reo {
  mcp-url = ""
  mcp-url = ${?REO_MCP_URL}
  redirect-uri = ""
  redirect-uri = ${?REO_REDIRECT_URI}
  okta-app-id = ""
  okta-app-id = ${?REO_OKTA_APP_ID}
