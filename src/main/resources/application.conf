google-drive {
  mcp-url = ""
  mcp-url = ${?GOOGLE_DRIVE_MCP_URL}
  # The shared Google Okta application id (Drive/Gmail/Calendar). No checked-in default.
  okta-app-id = ""
  okta-app-id = ${?GOOGLE_DRIVE_OKTA_APP_ID}
  client-id = ""
  client-id = ${?GOOGLE_DRIVE_CLIENT_ID}
  client-secret = ""
  client-secret = ${?GOOGLE_DRIVE_CLIENT_SECRET}
  redirect-uri = ""
  redirect-uri = ${?GOOGLE_DRIVE_REDIRECT_URI}
