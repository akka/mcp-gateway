  mcp-url = ""
  mcp-url = ${?SLACK_MCP_URL}
  okta-app-id = ""
  okta-app-id = ${?SLACK_OKTA_APP_ID}
  oauth {
    client-id = ""
    client-id = ${?SLACK_CLIENT_ID}
    client-secret = ""
    client-secret = ${?SLACK_CLIENT_SECRET}
    redirect-uri = ""
    redirect-uri = ${?SLACK_REDIRECT_URI}
