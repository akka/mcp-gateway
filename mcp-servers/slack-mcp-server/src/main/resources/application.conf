akka.javasdk.dev-mode.persistence.enabled = true

akka.http.server.request-timeout = 60 seconds

akka.javasdk.dev-mode.http-port=9001
akka.javasdk.dev-mode.acl.enabled = false

# Base URL of the Slack Web API. Only tests point this anywhere else.
slack.api-base-url = "https://slack.com/api/"

# Slack's hosted MCP server, used only to save drafts (the Web API cannot). The Slack app must have
# "Slack Model Context Protocol (MCP) Server" turned on under Agents. Only tests point this elsewhere.
slack.hosted-mcp-url = "https://mcp.slack.com/mcp"
