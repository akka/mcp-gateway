name: Deploy MCP Gateway on merge to main

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: Akka-Default-Latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git-commit-id-plugin

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run akka/github-actions-scripts
        uses: akka/github-actions-scripts/setup_global_resolver@main

      - name: Build and push image
        env:
          CLOUDSMITH_MACHINE_USER: ${{ secrets.CLOUDSMITH_MACHINE_USER }}
          CLOUDSMITH_MACHINE_PASSWORD: ${{ secrets.CLOUDSMITH_MACHINE_PASSWORD }}
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
        run: |
          echo "${CLOUDSMITH_MACHINE_PASSWORD}" | docker login "${CONTAINER_REGISTRY}" \
            --username="${CLOUDSMITH_MACHINE_USER}" \
            --password-stdin
          mvn clean install -DskipTests
          SHA=$(git rev-parse --short=7 HEAD)
          docker tag mcp-gateway:${SHA} "${CONTAINER_REGISTRY}/mcp-gateway/mcp-gateway:${SHA}"
          docker push "${CONTAINER_REGISTRY}/mcp-gateway/mcp-gateway:${SHA}"

      - name: Install and authenticate Akka CLI
        uses: akka/setup-akka-cli-action@v1.0.3
        with:
          token: ${{ secrets.AKKA_TOKEN }}
          project-id: ${{ secrets.AKKA_PROJECT_ID }}
          api-server-host: ${{ secrets.AKKA_API_HOST }}

      - name: Deploy to Akka
        id: deploy
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          akka service deploy mcp-gateway \
            "${CONTAINER_REGISTRY}/mcp-gateway/mcp-gateway:${SHA}" \
            --secret-env ANTHROPIC_API_KEY=anthropic/ANTHROPIC_API_KEY \
            --secret-env OKTA_CLIENT_ID=okta/OKTA_CLIENT_ID \
            --secret-env OKTA_CLIENT_SECRET=okta/OKTA_CLIENT_SECRET \
            --secret-env OKTA_ISSUER_URL=okta/OKTA_ISSUER_URL \
            --secret-env OKTA_REDIRECT_URI=okta/OKTA_REDIRECT_URI \
            --secret-env MCP_PROXY_OKTA_API_TOKEN=okta/MCP_PROXY_OKTA_API_TOKEN \
            --secret-env MCP_BASE_URL=okta/MCP_BASE_URL \
            --secret-env OKTA_ALLOWED_EMAIL_DOMAIN=okta/OKTA_ALLOWED_EMAIL_DOMAIN \
            --secret-env OKTA_GROUP_READER=okta/OKTA_GROUP_READER \
            --secret-env OKTA_GROUP_WRITER=okta/OKTA_GROUP_WRITER \
            --secret-env OKTA_GROUP_ADMIN=okta/OKTA_GROUP_ADMIN \
            --secret-env OKTA_GROUP_ESCALATER=okta/OKTA_GROUP_ESCALATER \
            --secret-env SUPPORT_EMAIL=okta/SUPPORT_EMAIL \
            --secret-env SUPPORT_SLACK_CHANNEL=okta/SUPPORT_SLACK_CHANNEL \
            --secret-env OKTA_ADMIN_MCP_URL=okta-admin/OKTA_ADMIN_MCP_URL \
            --secret-env OKTA_ADMIN_OKTA_APP_ID=okta-admin/OKTA_ADMIN_OKTA_APP_ID \
            --secret-env ZOHO_MCP_URL=zoho/ZOHO_MCP_URL \
            --secret-env ZOHO_REDIRECT_URI=zoho/ZOHO_REDIRECT_URI \
            --secret-env ZOHO_OKTA_APP_ID=zoho/ZOHO_OKTA_APP_ID \
            --secret-env SALESFORCE_MCP_URL=salesforce/SALESFORCE_MCP_URL \
            --secret-env SALESFORCE_CLIENT_ID=salesforce/SALESFORCE_CLIENT_ID \
            --secret-env SALESFORCE_CLIENT_SECRET=salesforce/SALESFORCE_CLIENT_SECRET \
            --secret-env SALESFORCE_REDIRECT_URI=salesforce/SALESFORCE_REDIRECT_URI \
            --secret-env SALESFORCE_OKTA_APP_ID=salesforce/SALESFORCE_OKTA_APP_ID \
            --secret-env SALESFORCE_OAUTH_LOGIN_URL=salesforce/SALESFORCE_OAUTH_LOGIN_URL \
            --secret-env AKKA_SALESFORCE_MCP_URL=akka-salesforce/AKKA_SALESFORCE_MCP_URL \
            --secret-env GOOGLE_DRIVE_MCP_URL=googledrive/GOOGLE_DRIVE_MCP_URL \
            --secret-env GOOGLE_DRIVE_CLIENT_ID=googledrive/GOOGLE_DRIVE_CLIENT_ID \
            --secret-env GOOGLE_DRIVE_CLIENT_SECRET=googledrive/GOOGLE_DRIVE_CLIENT_SECRET \
            --secret-env GOOGLE_DRIVE_REDIRECT_URI=googledrive/GOOGLE_DRIVE_REDIRECT_URI \
            --secret-env GOOGLE_DRIVE_OKTA_APP_ID=googledrive/GOOGLE_DRIVE_OKTA_APP_ID \
            --secret-env REO_MCP_URL=reo/REO_MCP_URL \
            --secret-env REO_REDIRECT_URI=reo/REO_REDIRECT_URI \
            --secret-env REO_OKTA_APP_ID=reo/REO_OKTA_APP_ID \
            --secret-env SLACK_CLIENT_ID=slack/SLACK_CLIENT_ID \
            --secret-env SLACK_CLIENT_SECRET=slack/SLACK_CLIENT_SECRET \
            --secret-env SLACK_REDIRECT_URI=slack/SLACK_REDIRECT_URI \
            --secret-env SLACK_MCP_URL=slack-mcp-url/SLACK_MCP_URL \
            --secret-env SLACK_OKTA_APP_ID=slack/SLACK_OKTA_APP_ID \
            --secret-env GMAIL_CLIENT_ID=gmail/GMAIL_CLIENT_ID \
            --secret-env GMAIL_CLIENT_SECRET=gmail/GMAIL_CLIENT_SECRET \
            --secret-env GMAIL_REDIRECT_URI=gmail/GMAIL_REDIRECT_URI \
            --secret-env GOOGLE_CALENDAR_CLIENT_ID=google-calendar/GOOGLE_CALENDAR_CLIENT_ID \
            --secret-env GOOGLE_CALENDAR_CLIENT_SECRET=google-calendar/GOOGLE_CALENDAR_CLIENT_SECRET \
            --secret-env GOOGLE_CALENDAR_REDIRECT_URI=google-calendar/GOOGLE_CALENDAR_REDIRECT_URI \
            --secret-env GROUNDCOVER_MCP_URL=groundcover/GROUNDCOVER_MCP_URL \
            --secret-env GROUNDCOVER_REDIRECT_URI=groundcover/GROUNDCOVER_REDIRECT_URI \
            --secret-env GROUNDCOVER_OKTA_APP_ID=groundcover/GROUNDCOVER_OKTA_APP_ID \
            --secret-env HUBSPOT_CLIENT_ID=hubspot/HUBSPOT_CLIENT_ID \
            --secret-env HUBSPOT_CLIENT_SECRET=hubspot/HUBSPOT_CLIENT_SECRET \
            --secret-env HUBSPOT_REDIRECT_URI=hubspot/HUBSPOT_REDIRECT_URI \
            --secret-env HUBSPOT_OKTA_APP_ID=hubspot/HUBSPOT_OKTA_APP_ID \
            --min-instances 1 \
            --max-instances 1 \
            --instance-type g1.general.x-small

      - name: Wait for new version to go live
        run: |
          SHA="${{ steps.deploy.outputs.sha }}"
          MAX_ATTEMPTS=8
          SLEEP_SECONDS=60
          echo "Waiting for service to reach Ready state..."
          sleep 15
          for i in $(seq 1 $MAX_ATTEMPTS); do
            SERVICE_LINE=$(akka service list 2>&1 | grep "mcp-gateway")
            echo "${SERVICE_LINE}"
            if echo "$SERVICE_LINE" | grep -q "Ready"; then
              echo "✓ Service is Ready (attempt ${i}/${MAX_ATTEMPTS})"
              exit 0
            fi
            echo "Attempt ${i}/${MAX_ATTEMPTS}: not Ready yet, retrying in ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
          done
          echo "✗ Service did not reach Ready state within $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes"
          akka service list
          exit 1
